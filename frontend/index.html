<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookly Support</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237a4a2b'/%3E%3Cpath d='M6 9c3-2 6-2 10 0v15c-4-2-7-2-10 0V9z' fill='none' stroke='%23f5ead9' stroke-width='1.6' stroke-linejoin='round'/%3E%3Cpath d='M26 9c-3-2-6-2-10 0v15c4-2 7-2 10 0V9z' fill='none' stroke='%23f5ead9' stroke-width='1.6' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #efe6d8;
    --paper: #faf5ec;
    --panel: #fffdf9;
    --ink: #2b2320;
    --muted: #8a7c6d;
    --accent: #7a4a2b;
    --accent-dark: #5e3820;
    --accent-light: #c99b5f;
    --accent-ink: #fffaf2;
    --bubble-user: linear-gradient(160deg, #8a5a37, #6d3f24);
    --bubble-agent: #f1e6d4;
    --border: #e4d5bd;
    --gold: #b4863f;
    --error: #a3372a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 50% 0%, rgba(255,255,255,0.5), transparent 60%),
      radial-gradient(rgba(122,74,43,0.08) 1px, transparent 1.2px) 0 0/16px 16px,
      var(--bg);
  }

  .app {
    width: 100%;
    max-width: 640px;
    height: 90vh;
    max-height: 820px;
    background: var(--panel);
    border-radius: 18px;
    box-shadow: 0 24px 60px rgba(43, 30, 15, 0.22), 0 2px 8px rgba(43, 30, 15, 0.08);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--border);
    position: relative;
  }

  header {
    padding: 20px 22px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    background: linear-gradient(180deg, #fbf6ec, #f7efe0);
    position: relative;
  }
  header::after {
    content: "";
    position: absolute;
    left: 22px;
    right: 22px;
    bottom: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold) 20%, var(--accent-light) 50%, var(--gold) 80%, transparent);
    opacity: 0.8;
  }
  header .logo {
    flex: none;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--accent-light), var(--accent) 55%, var(--accent-dark));
    color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25), 0 3px 8px rgba(94, 56, 32, 0.35);
  }
  header .logo svg { width: 22px; height: 22px; }
  header .title-wrap { min-width: 0; }
  header h1 {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    font-size: 19px;
    letter-spacing: 0.2px;
    margin: 0;
    color: var(--accent-dark);
  }
  header p {
    margin: 3px 0 0;
    font-size: 12px;
    color: var(--muted);
    font-style: italic;
    font-family: Georgia, "Palatino Linotype", serif;
  }

  /* ---- Identity gate ---- */
  #identity-gate {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 32px 30px;
    background:
      linear-gradient(180deg, rgba(122,74,43,0.03), transparent 80px),
      var(--paper);
    text-align: center;
  }
  #identity-gate .gate-icon {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--accent-light), var(--accent) 60%, var(--accent-dark));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(94, 56, 32, 0.3);
    margin-bottom: 6px;
  }
  #identity-gate .gate-icon svg { width: 26px; height: 26px; }
  #identity-gate h2 {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    color: var(--accent-dark);
    margin: 0;
    font-size: 20px;
  }
  #identity-gate .gate-sub {
    color: var(--muted);
    font-size: 13.5px;
    margin: 0 0 14px;
    max-width: 360px;
  }
  #identity-form {
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .field { text-align: left; }
  .field label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--accent-dark);
    margin-bottom: 5px;
  }
  .field input {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14.5px;
    outline: none;
    font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .field input:focus {
    border-color: var(--accent-light);
    box-shadow: 0 0 0 3px rgba(122, 74, 43, 0.12);
  }
  .field input.invalid { border-color: var(--error); }
  .field-error {
    min-height: 16px;
    color: var(--error);
    font-size: 12px;
    margin-top: 4px;
  }
  #identity-form .submit-btn {
    width: 100%;
    border-radius: 10px;
    height: 44px;
    font-size: 14.5px;
    font-weight: 600;
    font-family: inherit;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    scroll-behavior: smooth;
    padding: 22px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background:
      linear-gradient(180deg, rgba(122,74,43,0.03), transparent 80px),
      var(--paper);
  }
  @media (prefers-reduced-motion: reduce) {
    #messages { scroll-behavior: auto; }
  }

  /* soft custom scrollbar */
  #messages::-webkit-scrollbar { width: 8px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb {
    background: rgba(122, 74, 43, 0.28);
    border-radius: 10px;
  }
  #messages::-webkit-scrollbar-thumb:hover { background: rgba(122, 74, 43, 0.45); }
  #messages { scrollbar-width: thin; scrollbar-color: rgba(122,74,43,0.3) transparent; }

  .msg {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    animation: rise 0.28s ease both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user { justify-content: flex-end; }

  .msg-col { display: flex; flex-direction: column; max-width: 74%; }
  .msg.user .msg-col { align-items: flex-end; }
  .msg.agent .msg-col { align-items: flex-start; }

  .name-tag {
    font-size: 11px;
    color: var(--muted);
    margin-top: 3px;
    padding: 0 4px;
  }

  .avatar {
    flex: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .msg.agent .avatar {
    background: radial-gradient(circle at 35% 30%, var(--accent-light), var(--accent) 60%, var(--accent-dark));
    box-shadow: 0 2px 5px rgba(94, 56, 32, 0.3);
  }
  .msg.agent .avatar svg { width: 14px; height: 14px; }
  .msg.user .avatar {
    background: var(--border);
    color: var(--accent-dark);
    font-size: 11px;
    font-weight: 700;
  }

  .bubble {
    padding: 11px 15px;
    border-radius: 16px;
    line-height: 1.48;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
    box-shadow: 0 1px 2px rgba(43, 30, 15, 0.06);
  }
  .msg.user .bubble {
    background: var(--bubble-user);
    color: #fff8ef;
    border-bottom-right-radius: 5px;
  }
  .msg.agent .bubble {
    background: var(--bubble-agent);
    color: var(--ink);
    border: 1px solid rgba(122,74,43,0.08);
    border-bottom-left-radius: 5px;
  }

  .typing .bubble { display: flex; gap: 4px; align-items: center; padding: 13px 16px; }
  .typing .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    opacity: 0.55;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing .dot:nth-child(2) { animation-delay: 0.15s; }
  .typing .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 0.9; } }

  form#chat-form {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    background: #fbf6ec;
    border-top: 1px solid var(--border);
  }
  #input {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 999px;
    padding: 11px 18px;
    font-size: 14.5px;
    outline: none;
    font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  #input:focus {
    border-color: var(--accent-light);
    box-shadow: 0 0 0 3px rgba(122, 74, 43, 0.12);
  }
  button {
    flex: none;
    background: linear-gradient(160deg, var(--accent-light), var(--accent));
    color: var(--accent-ink);
    border: none;
    border-radius: 999px;
    width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(94, 56, 32, 0.3);
    transition: filter 0.15s, transform 0.1s;
  }
  button svg { width: 17px; height: 17px; transform: translateX(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
  button:hover:not(:disabled) { filter: brightness(1.05); }
  button:active:not(:disabled) { transform: scale(0.94); }

  /* ---- Bottom logout bar ---- */
  #logout-bar {
    padding: 8px 16px 12px;
    background: #fbf6ec;
    display: flex;
    justify-content: center;
  }
  #logout-btn {
    all: unset;
    cursor: pointer;
    font-size: 12.5px;
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 999px;
    transition: background 0.15s, color 0.15s;
  }
  #logout-btn:hover { background: rgba(122,74,43,0.08); color: var(--accent-dark); }

  /* ---- Confirm modal ---- */
  #modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(43, 30, 15, 0.38);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    animation: fadeIn 0.15s ease both;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-card {
    width: 100%;
    max-width: 300px;
    background: var(--panel);
    border-radius: 14px;
    box-shadow: 0 20px 50px rgba(43, 30, 15, 0.35);
    padding: 22px 22px 18px;
    text-align: center;
  }
  .modal-card h3 {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    color: var(--accent-dark);
    margin: 0 0 8px;
    font-size: 17px;
  }
  .modal-card p {
    margin: 0 0 18px;
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.45;
  }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions button {
    flex: 1;
    width: auto;
    height: 38px;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 600;
    font-family: inherit;
  }
  .modal-actions .btn-cancel {
    background: var(--bubble-agent);
    color: var(--accent-dark);
    box-shadow: none;
  }
  .modal-actions .btn-ok {
    background: linear-gradient(160deg, var(--accent-light), var(--accent));
    color: var(--accent-ink);
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 5.5c2.5-1.5 5-1.5 8 0v13c-3-1.5-5.5-1.5-8 0v-13z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M20 5.5c-2.5-1.5-5-1.5-8 0v13c3-1.5 5.5-1.5 8 0v-13z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="title-wrap">
        <h1>Bookly Support</h1>
        <p>Orders · Returns · Books · Account help</p>
      </div>
    </header>

    <div id="identity-gate">
      <div class="gate-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 5.5c2.5-1.5 5-1.5 8 0v13c-3-1.5-5.5-1.5-8 0v-13z" stroke="#fffaf2" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M20 5.5c-2.5-1.5-5-1.5-8 0v13c3-1.5 5.5-1.5 8 0v-13z" stroke="#fffaf2" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2>Welcome to Bookly Support</h2>
      <p class="gate-sub">Before we get started, could you tell us your name and email address?</p>
      <form id="identity-form" novalidate>
        <div class="field">
          <label for="name-input">Name</label>
          <input id="name-input" type="text" placeholder="Your full name" autocomplete="name" />
          <div class="field-error" id="name-error"></div>
        </div>
        <div class="field">
          <label for="email-input">Email address</label>
          <input id="email-input" type="email" placeholder="you@example.com" autocomplete="email" />
          <div class="field-error" id="email-error"></div>
        </div>
        <button class="submit-btn" type="submit">Start chatting</button>
      </form>
    </div>

    <div id="messages" class="hidden"></div>
    <form id="chat-form" class="hidden">
      <input id="input" type="text" placeholder="Ask about an order, a return, or a book…" autocomplete="off" />
      <button id="send" type="submit" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12l16-8-6 8 6 8-16-8z" fill="currentColor"/>
        </svg>
      </button>
    </form>
    <div id="logout-bar" class="hidden">
      <button id="logout-btn" type="button">Log Out</button>
    </div>

    <div id="modal-overlay" class="hidden">
      <div class="modal-card">
        <h3>Are you sure?</h3>
        <p>Logging out will end your current conversation and ask for your name and email again.</p>
        <div class="modal-actions">
          <button class="btn-cancel" type="button" id="modal-cancel">Cancel</button>
          <button class="btn-ok" type="button" id="modal-ok">OK</button>
        </div>
      </div>
    </div>
  </div>

<script>
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  const identityGateEl = document.getElementById("identity-gate");
  const identityFormEl = document.getElementById("identity-form");
  const nameInputEl = document.getElementById("name-input");
  const emailInputEl = document.getElementById("email-input");
  const nameErrorEl = document.getElementById("name-error");
  const emailErrorEl = document.getElementById("email-error");

  const messagesEl = document.getElementById("messages");
  const chatFormEl = document.getElementById("chat-form");
  const inputEl = document.getElementById("input");
  const sendEl = document.getElementById("send");
  const logoutBarEl = document.getElementById("logout-bar");
  const logoutBtnEl = document.getElementById("logout-btn");

  const modalOverlayEl = document.getElementById("modal-overlay");
  const modalCancelEl = document.getElementById("modal-cancel");
  const modalOkEl = document.getElementById("modal-ok");

  const AGENT_AVATAR = '<div class="avatar"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5c2.5-1.5 5-1.5 8 0v13c-3-1.5-5.5-1.5-8 0v-13z" stroke="#fffaf2" stroke-width="1.6" stroke-linejoin="round"/><path d="M20 5.5c-2.5-1.5-5-1.5-8 0v13c3-1.5 5.5-1.5 8 0v-13z" stroke="#fffaf2" stroke-width="1.6" stroke-linejoin="round"/></svg></div>';
  const USER_AVATAR = '<div class="avatar">You</div>';

  let sessionId = newSessionId();
  let currentUser = null; // { name, email }

  function newSessionId() {
    return "web-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  function softScrollToBottom() {
    messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: "smooth" });
  }

  function firstNameOf(fullName) {
    return fullName.trim().split(/\s+/)[0] || fullName;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function addBubble(text, who) {
    const row = document.createElement("div");
    row.className = "msg " + who;
    row.innerHTML = who === "agent" ? AGENT_AVATAR : "";

    const col = document.createElement("div");
    col.className = "msg-col";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    col.appendChild(bubble);

    if (who === "user" && currentUser) {
      const tag = document.createElement("div");
      tag.className = "name-tag";
      tag.textContent = firstNameOf(currentUser.name);
      col.appendChild(tag);
    }

    row.appendChild(col);
    if (who === "user") row.insertAdjacentHTML("beforeend", USER_AVATAR);
    messagesEl.appendChild(row);
    softScrollToBottom();
    return row;
  }

  function addGreetingBubble(firstName, email) {
    const row = document.createElement("div");
    row.className = "msg agent";
    row.innerHTML = AGENT_AVATAR;

    const col = document.createElement("div");
    col.className = "msg-col";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML =
      `Hi <strong>${escapeHtml(firstName)}</strong>! Welcome to Bookly Support — I have your email as <em>${escapeHtml(email)}</em>. ` +
      "How can I help you today? I can look into an order, start a return, or answer a question about our books, shipping, or your account.";
    col.appendChild(bubble);

    row.appendChild(col);
    messagesEl.appendChild(row);
    softScrollToBottom();
    return row;
  }

  function addTyping() {
    const row = document.createElement("div");
    row.className = "msg agent typing";
    row.innerHTML = AGENT_AVATAR + '<div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
    messagesEl.appendChild(row);
    softScrollToBottom();
    return row;
  }

  function startConversation(name, email) {
    currentUser = { name, email };
    identityGateEl.classList.add("hidden");
    messagesEl.classList.remove("hidden");
    chatFormEl.classList.remove("hidden");
    logoutBarEl.classList.remove("hidden");
    messagesEl.innerHTML = "";
    addGreetingBubble(firstNameOf(name), email);
    inputEl.focus();
  }

  function resetToIdentityGate() {
    currentUser = null;
    sessionId = newSessionId();
    messagesEl.innerHTML = "";
    chatFormEl.classList.add("hidden");
    messagesEl.classList.add("hidden");
    logoutBarEl.classList.add("hidden");
    identityFormEl.reset();
    nameErrorEl.textContent = "";
    emailErrorEl.textContent = "";
    nameInputEl.classList.remove("invalid");
    emailInputEl.classList.remove("invalid");
    identityGateEl.classList.remove("hidden");
    nameInputEl.focus();
  }

  identityFormEl.addEventListener("submit", (e) => {
    e.preventDefault();
    const name = nameInputEl.value.trim();
    const email = emailInputEl.value.trim();

    let valid = true;
    nameErrorEl.textContent = "";
    emailErrorEl.textContent = "";
    nameInputEl.classList.remove("invalid");
    emailInputEl.classList.remove("invalid");

    if (!name) {
      nameErrorEl.textContent = "Please tell us your name.";
      nameInputEl.classList.add("invalid");
      valid = false;
    }
    if (!email) {
      emailErrorEl.textContent = "Please enter your email address.";
      emailInputEl.classList.add("invalid");
      valid = false;
    } else if (!EMAIL_RE.test(email)) {
      emailErrorEl.textContent = "That doesn't look like a valid email address.";
      emailInputEl.classList.add("invalid");
      valid = false;
    }

    if (!valid) return;
    startConversation(name, email);
  });

  chatFormEl.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;

    addBubble(text, "user");
    inputEl.value = "";
    inputEl.disabled = true;
    sendEl.disabled = true;

    const typingRow = addTyping();

    try {
      const resp = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          session_id: sessionId,
          message: text,
          customer_name: currentUser ? currentUser.name : null,
          customer_email: currentUser ? currentUser.email : null,
        }),
      });
      typingRow.remove();
      if (!resp.ok) {
        addBubble("Sorry, something went wrong reaching support. Please try again.", "agent");
      } else {
        const data = await resp.json();
        addBubble(data.reply, "agent");
      }
    } catch (err) {
      typingRow.remove();
      addBubble("Sorry, I couldn't reach the support service. Please check your connection and try again.", "agent");
    } finally {
      inputEl.disabled = false;
      sendEl.disabled = false;
      inputEl.focus();
    }
  });

  logoutBtnEl.addEventListener("click", () => {
    modalOverlayEl.classList.remove("hidden");
  });

  modalCancelEl.addEventListener("click", () => {
    modalOverlayEl.classList.add("hidden");
  });

  modalOkEl.addEventListener("click", () => {
    modalOverlayEl.classList.add("hidden");
    resetToIdentityGate();
  });

  modalOverlayEl.addEventListener("click", (e) => {
    if (e.target === modalOverlayEl) modalOverlayEl.classList.add("hidden");
  });

  nameInputEl.focus();
</script>
</body>
</html>
