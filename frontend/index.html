<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookly Support</title>
<style>
  :root {
    --bg: #f5f1ea;
    --panel: #ffffff;
    --ink: #2b2320;
    --muted: #7a6f66;
    --accent: #7a4a2b;
    --accent-ink: #ffffff;
    --bubble-user: #7a4a2b;
    --bubble-agent: #efe7db;
    --border: #e3d9c9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 640px;
    height: 90vh;
    max-height: 820px;
    background: var(--panel);
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .logo {
    width: 34px; height: 34px;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 16px;
  }
  header h1 { font-size: 16px; margin: 0; }
  header p { margin: 0; font-size: 12px; color: var(--muted); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user .bubble { background: var(--bubble-user); color: #fff; border-bottom-right-radius: 4px; }
  .msg.agent .bubble { background: var(--bubble-agent); color: var(--ink); border-bottom-left-radius: 4px; }

  .typing .bubble { display: flex; gap: 4px; align-items: center; padding: 12px 16px; }
  .typing .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing .dot:nth-child(2) { animation-delay: 0.15s; }
  .typing .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }

  form {
    display: flex;
    gap: 10px;
    padding: 14px;
    border-top: 1px solid var(--border);
  }
  #input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  #input:focus { border-color: var(--accent); }
  button {
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:hover:not(:disabled) { filter: brightness(0.95); }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">B</div>
      <div>
        <h1>Bookly Support</h1>
        <p>Orders · Returns · Books · Account help</p>
      </div>
    </header>
    <div id="messages"></div>
    <form id="chat-form">
      <input id="input" type="text" placeholder="Ask about an order, a return, or a book…" autocomplete="off" />
      <button id="send" type="submit">Send</button>
    </form>
  </div>

<script>
  const sessionId = "web-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
  const messagesEl = document.getElementById("messages");
  const formEl = document.getElementById("chat-form");
  const inputEl = document.getElementById("input");
  const sendEl = document.getElementById("send");

  function addBubble(text, who) {
    const row = document.createElement("div");
    row.className = "msg " + who;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  function addTyping() {
    const row = document.createElement("div");
    row.className = "msg agent typing";
    row.innerHTML = '<div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  addBubble("Hi! I'm the Bookly support assistant. I can help with order status, returns, book questions, or your account. What can I help with today?", "agent");

  formEl.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;

    addBubble(text, "user");
    inputEl.value = "";
    inputEl.disabled = true;
    sendEl.disabled = true;

    const typingRow = addTyping();

    try {
      const resp = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });
      typingRow.remove();
      if (!resp.ok) {
        addBubble("Sorry, something went wrong reaching support. Please try again.", "agent");
      } else {
        const data = await resp.json();
        addBubble(data.reply, "agent");
      }
    } catch (err) {
      typingRow.remove();
      addBubble("Sorry, I couldn't reach the support service. Please check your connection and try again.", "agent");
    } finally {
      inputEl.disabled = false;
      sendEl.disabled = false;
      inputEl.focus();
    }
  });
</script>
</body>
</html>
