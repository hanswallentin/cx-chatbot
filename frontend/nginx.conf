server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxied to the backend by Docker Compose service name — never
    # a hard-coded host/IP, so this same config works unchanged in any
    # cloud environment that preserves the service name via DNS/service
    # discovery (ECS Service Connect, Azure Container Apps, Kubernetes, etc).
    location /api/ {
        proxy_pass http://backend:8200/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
